name: Release ShowOrganizer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install JPRM
      run: |
        python -m pip install --upgrade pip
        pip install jprm==1.1.0 PyYAML

    - name: Extract Version
      run: |
        VERSION=$(python -c "import yaml; print(yaml.safe_load(open('build.yaml'))['version'])")
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Extracted version: $VERSION"

    - name: Pre-flight Verification
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 1. Verify running on main branch
        if [ "${{ github.ref }}" != "refs/heads/main" ]; then
          echo "ERROR: Release workflow must be triggered from the main branch."
          exit 1
        fi

        # 2. Verify git tag does not already exist
        if [ -n "$(git ls-remote --tags origin refs/tags/v${{ env.VERSION }})" ]; then
          echo "ERROR: Git tag v${{ env.VERSION }} already exists on origin."
          exit 1
        fi

        # 3. Verify GitHub release does not already exist
        if gh release view "v${{ env.VERSION }}" >/dev/null 2>&1; then
          echo "ERROR: GitHub release for v${{ env.VERSION }} already exists."
          exit 1
        fi

        echo "Pre-flight checks passed: version v${{ env.VERSION }} is available for release."

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Release
      run: dotnet build --configuration Release --no-restore

    - name: Run tests
      run: dotnet test --configuration Release --no-build

    - name: Package Plugin with JPRM
      run: |
        mkdir -p artifacts
        python -m jprm plugin build . --output=./artifacts

    - name: Validate Package
      run: |
        # Run local custom ReleaseVerifier to inspect ZIP and meta.json parameters
        dotnet run --project tools/ReleaseVerifier/ReleaseVerifier.csproj "artifacts/showorganizer_${{ env.VERSION }}.zip" build.yaml

    - name: Push Git Tag
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Tag the exact SHA of the runner workspace checkout
        git tag -a "v${{ env.VERSION }}" "$GITHUB_SHA" \
          -m "ShowOrganizer ${{ env.VERSION }}"
        git push origin "v${{ env.VERSION }}"

    - name: Create GitHub Release and Upload Asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Read the changelog dynamically from build.yaml
        CHANGELOG=$(python -c "import yaml; print(yaml.safe_load(open('build.yaml'))['changelog'])")
        
        gh release create "v${{ env.VERSION }}" \
          --title "ShowOrganizer ${{ env.VERSION }}" \
          --notes "$CHANGELOG" \
          "artifacts/showorganizer_${{ env.VERSION }}.zip"

    - name: Update manifest.json
      run: |
        ASSET_URL="https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/showorganizer_${{ env.VERSION }}.zip"
        python -m jprm repo add --plugin-url "$ASSET_URL" . "artifacts/showorganizer_${{ env.VERSION }}.zip"

    - name: Commit and Push manifest.json updates
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Switch to branch main to commit manifest updates
        git checkout main
        git pull origin main
        
        git add manifest.json
        git commit -m "Update manifest for ShowOrganizer ${{ env.VERSION }}"
        git push origin main
